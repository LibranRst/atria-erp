# QA frontend only. No database, API, worker or paid instance is provisioned.
services:
  - type: web
    name: atria-dekoria
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/LibranRst/atria-erp
    branch: codex/render-qa-frontend
    autoDeployTrigger: off
    buildCommand: bun install --frozen-lockfile && bun run heroui:styles:check && NEXT_PUBLIC_APP_URL="$RENDER_EXTERNAL_URL" bun run build:web
    startCommand: NEXT_PUBLIC_APP_URL="$RENDER_EXTERNAL_URL" bun run --cwd apps/web start --hostname 0.0.0.0 --port "$PORT"
    healthCheckPath: /manifest.webmanifest
    envVars:
      - key: BUN_VERSION
        value: "1.3.14"
      - key: NODE_VERSION
        value: "22.23.2"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: API_ORIGIN
        value: https://atria-verification-api-production.up.railway.app
      - key: API_BRIDGE_SECRET
        sync: false
      - key: NEXT_PUBLIC_ATRIA_PILOT_MODE
        value: "false"
