# In Netlify UI: Package directory = apps/web. Package cannot be set in TOML.
[build]
  base = "."
  command = "bun run heroui:styles:check && bun run build:web"
  publish = "apps/web/.next"

[build.environment]
  BUN_VERSION = "1.3.14"
  BUN_FLAGS = "--frozen-lockfile"
  NODE_VERSION = "22"
  NEXT_PUBLIC_ATRIA_PILOT_MODE = "true"

# Free site variables use all platform scopes; narrowing scopes requires Pro.
# API_ORIGIN / API_BRIDGE_SECRET use production context only and server-only
# names (never NEXT_PUBLIC). Disable auto/preview deploys for this pilot site.
# Never put real secrets in this file or enable paid Secrets Controller flags.
